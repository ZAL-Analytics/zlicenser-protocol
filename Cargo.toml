[workspace]
members = ["xtask", "tools/bundle-cli"]
resolver = "2"

[package]
name = "zlicenser-protocol"
version = "0.2.0"
edition = "2021"
authors = ["ZAL Analytics <arsalan@anwari.nl>"]
description = "Shared protocol types, wire formats, cryptographic primitives, and hardware fingerprinting for the zlicenser licensing framework."
documentation = "https://docs.rs/zlicenser-protocol"
repository = "https://github.com/zal-analytics/zlicenser-protocol"
license = "Apache-2.0"
keywords = ["licensing", "hardware-fingerprint", "protocol", "cryptography", "zlicenser"]
categories = ["encoding", "network-programming", "cryptography"]
readme = "README.md"
publish = true

[features]
default = ["validate", "tsa-verify"]
validate = []
collect-linux = ["dep:nix", "dep:procfs", "dep:raw-cpuid"]
tpm = ["collect-linux", "dep:tss-esapi"]
tsa-verify = ["dep:rasn", "dep:rasn-pkix", "dep:rsa", "dep:p256", "dep:p384"]
tsa-clients = ["tsa-verify", "dep:reqwest"]
# Enables the in-process mock TSA server used in integration tests.
# Not suitable for production — only add to dev/test builds.
tsa-test-utils = ["tsa-clients", "dep:rcgen", "dep:chrono", "dep:tokio"]

[dependencies]
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
vsss-rs = "4"
zeroize = { version = "1", features = ["derive"] }

nix = { version = "0.29", optional = true }
procfs = { version = "0.16", optional = true }
raw-cpuid = { version = "11", optional = true }
chrono = { version = "0.4", optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
rasn = { version = "0.22", optional = true }
rasn-pkix = { version = "0.22", optional = true }
rcgen = { version = "0.13", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false, optional = true }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "macros"], optional = true }
rsa = { version = "0.9", features = ["sha2"], optional = true }
tss-esapi = { version = "7.7.0", optional = true }

[dev-dependencies]
chrono = "0.4"
hex = "0.4"
insta = "1"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "create_bundle"
required-features = ["collect-linux"]

[[example]]
name = "linux_collect"
required-features = ["collect-linux"]

[[example]]
name = "tsa_stamp"
required-features = ["tsa-clients"]
